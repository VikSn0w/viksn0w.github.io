<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style>
<title>Shell Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --table:#0A1612; --felt:#1D5040; --felt-deep:#12372B; --rim:#3B2414;
  --panel:#10231C; --panel-2:#163027; --panel-line:#2A4A3C;
  --paper:#F1EADB; --paper-2:#E3D8C2; --paper-edge:#B8AB92; --ink:#1C1A16; --ink-soft:#5E574A;
  --text:#ECE5D5; --muted:#9DB4A8;
  --brass:#E3B44B; --brass-deep:#9A7021; --red:#D9483A; --mint:#5CCB8F;
  --env:#26251F; --env-2:#35332B;
  --display:'Bungee',Impact,'Arial Black',sans-serif;
  --sans:'Rubik',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--table)}
body{color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.45;padding-inline:16px;
  background:radial-gradient(ellipse at 40% 20%,#15302A 0%,var(--table) 60%) fixed}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* Top bar */
.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;max-width:1440px;margin:0 auto;padding-block:12px 12px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.02em;margin:0;line-height:1;color:var(--paper);text-shadow:0 3px 0 var(--brass-deep)}
.seats{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.seat{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--panel-line);border-radius:40px;padding:4px 14px 4px 4px;position:relative;transition:box-shadow .2s,transform .2s}
.seat.turn{box-shadow:0 0 0 2px var(--brass),0 0 18px rgba(227,180,75,.35);transform:translateY(-1px)}
.seat.dead{filter:grayscale(1);opacity:.45}
.av{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.45) 0 14%,transparent 42%),var(--pc);display:grid;place-items:center;font-family:var(--display);font-size:14px;color:#fff;border:2px solid #fff;flex:none;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.seat .nm{font-weight:600;font-size:13px;line-height:1.1}
.seat .nm small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.seat .cash{font-family:var(--display);font-size:14px;color:var(--brass);font-variant-numeric:tabular-nums}
.seat .cash.hid{font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:500}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.chip{appearance:none;border:1px solid var(--panel-line);background:var(--panel);color:var(--text);padding:7px 12px;border-radius:30px;font-weight:600;font-size:12.5px;cursor:pointer}
.chip:hover{border-color:var(--brass)}
.chip.on{border-color:var(--brass);color:var(--brass)}

/* Layout */
.layout{display:flex;gap:22px;align-items:flex-start;max-width:1440px;margin:0 auto;padding-block:8px 28px}
.board-scroll{flex:1 1 auto;min-width:0;max-width:min(100%,calc(100dvh - 110px));overflow-x:auto;padding:12px 10px 16px;margin:-6px -10px 0}
.board-wrap{width:100%;min-width:620px;container-type:inline-size;position:relative}
.side{flex:0 0 390px;background:var(--panel);border:1px solid var(--panel-line);border-radius:14px;position:sticky;top:env(safe-area-inset-top,0px);max-height:calc(100dvh - 20px);display:flex;flex-direction:column;overflow:hidden}
@media (max-width:940px){
  .layout{flex-direction:column;align-items:stretch}
  .board-scroll{max-width:none;width:calc(100% + 20px)}
  .side{flex:none;position:static;max-height:none;width:100%}
}

/* Board */
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(10,minmax(0,1fr));aspect-ratio:1;max-width:100%;gap:.5cqi;padding:.8cqi;border-radius:2cqi;
  background:radial-gradient(circle at 50% 46%,#2A6B55 0%,var(--felt) 38%,var(--felt-deep) 78%);
  box-shadow:0 0 0 .9cqi var(--rim),0 0 0 1.1cqi #5A3A20,0 3cqi 6cqi rgba(0,0,0,.6)}
.tile{appearance:none;border:0;padding:0;position:relative;display:flex;flex-direction:column;overflow:hidden;cursor:pointer;text-align:left;border-radius:.9cqi;min-width:0;min-height:0;
  background:var(--paper);color:var(--ink);box-shadow:0 .35cqi 0 var(--paper-edge),0 .8cqi 1.4cqi rgba(0,0,0,.35);transition:transform .15s}
.tile:hover{transform:translateY(-.35cqi)}
.tile.sel{box-shadow:0 0 0 .5cqi var(--brass),0 .35cqi 0 var(--paper-edge),0 .8cqi 1.6cqi rgba(0,0,0,.45);z-index:2}
.band{height:1.9cqi;position:relative;overflow:hidden;flex:none;display:flex;gap:.5cqi;align-items:center;justify-content:flex-end;padding-inline:.8cqi}
.house{width:1.05cqi;height:1cqi;background:#fff;clip-path:polygon(50% 0,100% 45%,100% 100%,0 100%,0 45%)}
.tname{font-size:1.26cqi;line-height:1.08;font-weight:600;padding:.5cqi .6cqi 0;overflow-wrap:break-word}
.tfoot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:0 .5cqi .5cqi .6cqi;gap:.3cqi}
.tprice{font-family:var(--display);font-size:1.35cqi;color:var(--ink);font-variant-numeric:tabular-nums}
.trent{font-size:1.12cqi;line-height:1.1;color:var(--ink-soft);font-weight:600}
.own{width:2.2cqi;height:2.2cqi;border-radius:50%;background:var(--pc);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:1.1cqi;border:.22cqi solid #fff;box-shadow:0 .2cqi .4cqi rgba(0,0,0,.3);flex:none}
.bidpin{width:1.2cqi;height:1.2cqi;border-radius:50%;background:var(--brass);box-shadow:0 0 0 .3cqi rgba(227,180,75,.35)}
/* shell envelope */
.tile.env{background:linear-gradient(165deg,var(--env-2),var(--env));color:#EDE4D0;box-shadow:0 .35cqi 0 #0e0d0b,0 .8cqi 1.4cqi rgba(0,0,0,.45)}
.tile.env::before{content:"";position:absolute;left:0;right:0;top:1.9cqi;height:3.6cqi;background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.02));clip-path:polygon(0 0,100% 0,50% 100%);pointer-events:none}
.tile.env .tname{color:#EDE4D0}
.tile.env .alias{font-size:.98cqi;color:#BDB29A;padding:.15cqi .6cqi 0;line-height:1.1;font-style:italic}
.seal{width:2.5cqi;height:2.5cqi;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.35cqi;color:#3a2808;flex:none;
  background:radial-gradient(circle at 38% 32%,#F6D98C 0 18%,var(--brass) 45%,var(--brass-deep) 100%);box-shadow:0 .2cqi .5cqi rgba(0,0,0,.5)}
.seal.mine{background:radial-gradient(circle at 38% 32%,rgba(255,255,255,.5) 0 16%,var(--pc) 50%);color:#fff}
.tile.env .trent{color:#BDB29A}
.stamp{position:absolute;left:50%;top:56%;transform:translate(-50%,-50%) rotate(-14deg);font-family:var(--display);font-size:1.02cqi;color:var(--red);border:.22cqi solid var(--red);padding:.1cqi .6cqi;border-radius:.4cqi;opacity:.85;pointer-events:none;letter-spacing:.04em;background:rgba(241,234,219,.6)}
.stamp.in{animation:stampin .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampin{0%{transform:translate(-50%,-50%) rotate(-30deg) scale(3);opacity:0}100%{transform:translate(-50%,-50%) rotate(-14deg) scale(1);opacity:.85}}
/* corners */
.tile.corner,.tile.ticker,.tile.rumor,.tile.tax{background:#0F2B22;color:var(--paper);box-shadow:inset 0 0 0 1px #2E5A48,0 .6cqi 1.2cqi rgba(0,0,0,.35)}
.tile.corner .tname,.tile.ticker .tname,.tile.rumor .tname,.tile.tax .tname{font-family:var(--display);font-weight:400;font-size:1.65cqi;padding-top:.8cqi;letter-spacing:.02em}
.tile.ticker .tname,.tile.rumor .tname,.tile.tax .tname{font-size:1.25cqi}
.tsub{font-size:1.02cqi;line-height:1.1;color:var(--muted);font-weight:500}
.ico{width:3cqi;height:3cqi;margin:auto auto .4cqi .6cqi;color:var(--brass)}
.tile.corner .tfoot,.tile.ticker .tfoot,.tile.rumor .tfoot,.tile.tax .tfoot{padding-bottom:.7cqi}
.tile.corner .ico{width:3.8cqi;height:3.8cqi}

/* Center */
.center{position:absolute;left:10.69cqi;top:10.69cqi;width:78.62cqi;height:78.62cqi;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8cqi;text-align:center;padding:2cqi;pointer-events:none}
.center > *{pointer-events:auto}
.wordmark{font-family:var(--display);font-size:7cqi;line-height:.9;margin:0;color:var(--paper);text-shadow:0 .55cqi 0 var(--brass-deep),0 1.2cqi 2cqi rgba(0,0,0,.4);letter-spacing:.01em}
.wordmark span{color:var(--brass);text-shadow:0 .55cqi 0 #5d4210,0 1.2cqi 2cqi rgba(0,0,0,.4)}
.roundline{font-size:max(11px,1.55cqi);color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin:0}
.dice{display:flex;gap:3.2cqi;perspective:60cqi;padding-block:.6cqi}
.cube{width:6.8cqi;height:6.8cqi;position:relative;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.15,.75,.25,1)}
.face{position:absolute;inset:0;background:#FBF7EE;border-radius:1.3cqi;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:1.1cqi;box-shadow:inset 0 0 0 .2cqi #DCD2BE,inset 0 -.6cqi 1cqi rgba(0,0,0,.08)}
.face b{width:1.2cqi;height:1.2cqi;border-radius:50%;background:var(--ink);place-self:center}
.face.f1 b{background:var(--red);width:1.7cqi;height:1.7cqi}
.f1{transform:translateZ(3.4cqi)} .f6{transform:rotateY(180deg) translateZ(3.4cqi)}
.f3{transform:rotateY(90deg) translateZ(3.4cqi)} .f4{transform:rotateY(-90deg) translateZ(3.4cqi)}
.f5{transform:rotateX(90deg) translateZ(3.4cqi)} .f2{transform:rotateX(-90deg) translateZ(3.4cqi)}
.ctrl{display:flex;flex-direction:column;align-items:center;gap:1.4cqi;min-height:14cqi}
.msg{font-size:max(12.5px,1.85cqi);max-width:60cqi;margin:0;color:var(--text);text-wrap:balance}
.msg strong{color:var(--brass);font-weight:600}
.row{display:flex;gap:1.4cqi;flex-wrap:wrap;justify-content:center;align-items:center}
.big{appearance:none;border:0;cursor:pointer;font-family:var(--display);font-size:max(15px,2.5cqi);padding:1.1cqi 3.6cqi;border-radius:1.2cqi;background:var(--brass);color:#241806;box-shadow:0 .6cqi 0 var(--brass-deep),0 1cqi 2cqi rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s}
.big:hover{filter:brightness(1.06)}
.big:active{transform:translateY(.5cqi);box-shadow:0 .1cqi 0 var(--brass-deep)}
.big:disabled{opacity:.45;cursor:not-allowed}
.big.ghost{background:#244C3D;color:var(--paper);box-shadow:0 .6cqi 0 #122A21}
.tipnote{background:var(--paper);color:var(--ink);font-size:max(12px,1.65cqi);padding:1cqi 1.6cqi;border-radius:.6cqi;max-width:58cqi;transform:rotate(-1.2deg);box-shadow:0 .5cqi 1.2cqi rgba(0,0,0,.35);margin:0;text-align:left}
.tipnote b{font-family:var(--display);font-weight:400;color:var(--brass-deep);margin-right:.4em}
.thinking{font-size:max(12px,1.7cqi);color:var(--muted)}
.thinking i{display:inline-block;width:.5em;height:.5em;border-radius:50%;background:var(--muted);margin-left:.25em;animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

/* Tokens */
.tokens{position:absolute;inset:0;pointer-events:none}
.token{position:absolute;width:2.8cqi;height:2.8cqi;margin:-1.4cqi 0 0 -1.4cqi;border-radius:50%;z-index:5;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.6) 0 14%,transparent 42%),var(--pc);border:.4cqi solid #fff;
  box-shadow:0 .7cqi 1cqi rgba(0,0,0,.55);transition:left .16s ease-out,top .16s ease-out;display:grid;place-items:center;font-family:var(--display);font-size:1.15cqi;color:#fff}
.token.h1{animation:hop1 .16s ease-out}.token.h2{animation:hop2 .16s ease-out}
@keyframes hop1{50%{transform:translateY(-1.3cqi) scale(1.08)}}
@keyframes hop2{50%{transform:translateY(-1.3cqi) scale(1.08)}}
.token.active{box-shadow:0 0 0 .5cqi rgba(227,180,75,.55),0 .7cqi 1cqi rgba(0,0,0,.55)}

/* Side panel */
.tabs{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--panel-line);flex:none}
.tab{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 6px;border-radius:8px;cursor:pointer}
.tab.on{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--brass)}
.tab .n{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--brass);color:#241806;font-size:10.5px;margin-left:4px}
.pane{padding:14px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.pane h3{font-family:var(--display);font-weight:400;font-size:15px;margin:0;letter-spacing:.02em;color:var(--paper)}
.lede{color:var(--muted);font-size:13px;margin:0}
.lede strong{color:var(--text);font-weight:600}

/* Deed */
.deed{background:var(--paper);color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.deed-top{padding:10px 14px 12px;color:#fff;text-align:center}
.deed-top small{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.85;font-weight:600}
.deed-top h4{font-family:var(--display);font-weight:400;font-size:22px;margin:2px 0 0;line-height:1.05}
.deed-top.envtop{background:linear-gradient(165deg,var(--env-2),var(--env))}
.deed-body{padding:10px 14px 14px}
.rl{display:flex;justify-content:space-between;padding:3px 6px;font-size:13px;border-radius:5px}
.rl span:last-child{font-weight:600;font-variant-numeric:tabular-nums}
.rl.on{background:var(--ink);color:var(--paper)}
.deed-meta{display:flex;justify-content:space-between;gap:10px;border-top:1px dashed var(--paper-edge);margin-top:8px;padding-top:8px;font-size:12.5px;color:var(--ink-soft)}
.deed-meta b{color:var(--ink);font-weight:600}
.owner-line{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:8px}
.owner-line .av{width:24px;height:24px;font-size:11px;border-width:1.5px}
.qmark{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:12px;color:#3a2808;background:radial-gradient(circle at 38% 32%,#F6D98C 0 18%,var(--brass) 45%,var(--brass-deep) 100%)}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 6px;border-radius:4px;background:var(--paper-2);color:var(--ink-soft)}
.badge.red{background:var(--red);color:#fff}
.badge.dark{background:var(--env);color:var(--brass)}
.act{display:flex;flex-direction:column;gap:8px;background:var(--panel-2);border:1px solid var(--panel-line);border-radius:10px;padding:12px}
.act h5{margin:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.act p{margin:0;font-size:12.5px;color:var(--muted)}
.act p strong{color:var(--text);font-weight:600}
.btn{appearance:none;border:0;cursor:pointer;font-weight:700;font-size:13.5px;padding:10px 14px;border-radius:9px;background:var(--brass);color:#241806;box-shadow:0 3px 0 var(--brass-deep)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--brass-deep)}
.btn.sec{background:#2B5646;color:var(--text);box-shadow:0 3px 0 #173229}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.bidrow{display:flex;gap:8px}
.bidrow input{flex:1;min-width:0;font:600 15px var(--sans);padding:9px 12px;border:1px solid var(--panel-line);border-radius:9px;background:var(--table);color:var(--text)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.flash{font-size:12.5px;color:var(--brass);font-weight:600;margin:0}

/* Certificates */
.certs{display:grid;grid-template-columns:1fr;gap:10px}
.cert{background:var(--paper);color:var(--ink);border-radius:10px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.3);position:relative}
.cert::after{content:"";position:absolute;inset:5px;border:1px solid rgba(28,26,22,.12);border-radius:7px;pointer-events:none}
.cert-h{display:flex;align-items:center;gap:10px;padding:8px 12px;color:#fff}
.cert-h .tk{font-family:var(--display);font-size:15px}
.cert-h .dn{font-weight:600;font-size:13px;opacity:.95}
.cert-h .pr{margin-left:auto;font-family:var(--display);font-size:17px}
.cert-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px}
.cert-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.chg{font-size:12px;font-weight:700}
.chg.up{color:#1B8A55}.chg.down{color:var(--red)}
.slots{display:grid;grid-template-columns:repeat(20,1fr);gap:2px}
.slots i{height:10px;border-radius:2px;background:var(--paper-2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.cert-legend{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.cert-legend b{color:var(--ink)}
.cert .btns{display:flex;gap:6px}
.cert .btns .btn{flex:1}
.cert .btn.sec{background:var(--paper-2);color:var(--ink);box-shadow:0 3px 0 var(--paper-edge)}
.explain{background:var(--panel-2);border:1px solid var(--panel-line);border-radius:10px;padding:12px;font-size:12.5px;color:var(--muted)}
.explain b{color:var(--brass);font-weight:600}
.flow{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;font-size:12px;color:var(--text)}
.flow span{background:var(--table);padding:4px 8px;border-radius:6px}

/* Empire */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--panel-2);border:1px solid var(--panel-line);border-radius:10px;padding:10px 12px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:20px;color:var(--brass);font-variant-numeric:tabular-nums}
.items{list-style:none;margin:0;padding:0;font-size:13px}
.items li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--panel-line)}
.items li:first-child{border-top:0}
.items .meta{color:var(--muted);font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--dc);margin-right:6px}

/* Ledger */
.log{list-style:none;margin:0;padding:0;font-size:12.5px}
.log li{padding:6px 0;border-top:1px solid var(--panel-line);display:grid;grid-template-columns:28px 1fr;gap:6px}
.log li:first-child{border-top:0}
.log li b{font-weight:600;color:var(--muted);font-size:11px;padding-top:1px}
.log li.round span{font-weight:600;color:var(--brass)}
.log li.filing span{font-weight:600}
.log li.bad span{color:#F08A7E}
.log li.priv span::after{content:"  " attr(data-priv);color:var(--brass);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* FX layer */
.fx{position:fixed;inset:0;pointer-events:none;z-index:40}
.pop{position:absolute;transform:translate(-50%,0);font-family:var(--display);font-size:17px;white-space:nowrap;animation:rise 1.7s ease-out forwards;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.pop small{font-family:var(--sans);font-size:11px;font-weight:600;display:block;text-align:center;opacity:.9;text-shadow:none}
.pop.plus{color:var(--mint)}.pop.minus{color:#FF7A6B}
@keyframes rise{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}15%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-34px)}}

function flushFx() {
  if (!G) return;
  const layer = $('#fx'), v = viewer(), count = {};
  G.fx.splice(0).forEach(f => {
    if (!(f.pub || f.pid === v || G.over)) return;
    if (f.type !== 'say' && !f.amt) return;
    const seat = document.querySelector(`.seat[data-pid="${f.pid}"]`);
    if (!seat) return;
    const r = seat.getBoundingClientRect();
    const k = count[f.pid] = (count[f.pid] ?? -1) + 1;
    const el = document.createElement('div');
    if (f.type === 'say') {
      el.className = 'say'; el.textContent = f.text[LANG];
      el.style.left = (r.left + r.width / 2) + 'px'; el.style.top = (r.bottom + 10) + 'px';
      setTimeout(() => el.remove(), 2900);
    } else {
      el.className = 'pop ' + (f.amt > 0 ? 'plus' : 'minus');
      el.innerHTML = `${f.amt > 0 ? '+' : '−'}${fmt(Math.abs(f.amt))}<small>${f.label[LANG]}</small>`;
      el.style.left = (r.left + r.width / 2 + k * 28) + 'px'; el.style.top = (r.bottom + 4 + k * 8) + 'px';
      el.style.animationDelay = (k * .15) + 's';
      setTimeout(() => el.remove(), 2000);
      if (f.pid === v) (f.amt > 0 ? sfx.plus : sfx.minus)();
    }
    layer.appendChild(el);
  });
}

    else if (a === 'tdsh') { const d = +b.dataset.d; TD[side].shares[d] = clamp(TD[side].shares[d] + +b.dataset.v, 0, holder.shares[d]); }
    else if (a === 'tdsec') { const i = +b.dataset.i, arr = TD.give.secrets; arr.includes(i) ? arr.splice(arr.indexOf(i), 1) : arr.push(i); }
    else if (a === 'tdnsec') TD.get.nsec = clamp(TD.get.nsec + +b.dataset.v, 0, 3);
    else if (a === 'tdadd') { TD.give.cash += TD.add; TD.add = 0; }
    else if (a === 'tdgo') proposeTrade();
    render(); return;
  }
  if (!isMyTurn()) return;
  G.flash = null;
  if (a === 'roll') { await doRoll(); return; }
  if (a === 'trade') { openTrade(b.dataset.pid != null ? +b.dataset.pid : null); render(); return; }
  if (a === 'settle') settle(+b.dataset.d);
  else if (a === 'bribe') bribe(b.dataset.k, b.dataset.a === '' ? null : +b.dataset.a);
  else
  if (a === 'buy') buyLanded();
  else if (a === 'pass') passLanded();
  else if (a === 'end') { endTurn(); return; }
  else if (a === 'file') G.flash = bidMsg(fileBid(sel, +$('#bidAmt').value));
  else if (a === 'quickbid') G.flash = bidMsg(fileBid(sel, +b.dataset.a));
  else if (a === 'cancelfile') cancelFiling(+b.dataset.i);
  else if (a === 'inv') investigate(sel);
  else if (a === 'build') queueBuild(sel);
  else if (a === 'bs') buyShare(+b.dataset.d);
  else if (a === 'ss') sellShare(+b.dataset.d);
  render();
  if (!G.over && !cur().alive) endTurn();
});
document.addEventListener('input', e => {
  if (TD && e.target.classList.contains('tcash')) TD[e.target.dataset.side].cash = Math.max(0, Math.floor(+e.target.value || 0));
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList?.contains('seat') && e.target.dataset.act) { e.target.click(); return; }
  if (e.target.id === 'bidAmt' && e.key === 'Enter') { e.preventDefault(); document.querySelector('[data-act="file"]')?.click(); return; }
  if ((e.key === ' ' || e.key === 'Enter') && e.target === document.body) {
    const p = document.getElementById('primary');
    if (p && !p.disabled) { e.preventDefault(); p.click(); }
  }
});
window.addEventListener('resize', () => { if (G) renderTokens(false); });

buildDice();
spinDice(3, 4);
newGame(1, 3);
})();
</script>
