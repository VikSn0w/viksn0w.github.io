const HINT = "Point at the track, or drag along the speed trace below, to inspect a point. When the trace has focus, the arrow keys step through the lap.";
let mode = "speed", cursor = -1, photo = null, showPhoto = false;
const el = id => document.getElementById(id);
const mapCanvas = el("map"), traceCanvas = el("trace");

document.querySelector("h1").textContent = D.title;
el("lap").textContent = D.lapTime;
el("top").textContent = vMax.toFixed(0) + " km/h";
el("min").textContent = vMin.toFixed(0) + " km/h";
el("readout").textContent = HINT;
if (D.link3d) { el("to3d").href = D.link3d; el("to3d").hidden = false; }
if (D.csv) { el("csv").href = D.csv; el("csv").hidden = false; }
if (D.lean) el("leanBtn").hidden = false;
if (D.bg) {
  photo = new Image(); photo.onload = () => draw(); photo.src = D.bg.src;
  el("photoBtn").hidden = false;
  el("photoBtn").addEventListener("click", () => { showPhoto = !showPhoto; el("photoBtn").setAttribute("aria-checked", showPhoto); draw(); });
}
traceCanvas.setAttribute("aria-valuemin", 0);
traceCanvas.setAttribute("aria-valuemax", Math.round(D.s[n - 1]));

function describeMode() {
  el("legend").innerHTML = mode === "speed" ? legendHTML("speed", vMin.toFixed(0), vMax.toFixed(0), " km/h")
    : mode === "lean" ? legendHTML("lean", 0, leanMax.toFixed(0), "°") : legendHTML("inputs");
  mapCanvas.setAttribute("aria-label", `Track map with the racing line coloured by ${MODE_NAMES[mode].toLowerCase()}. ` +
    `Lap ${D.lapTime}, speed ${vMin.toFixed(0)} to ${vMax.toFixed(0)} km/h. Per-point data is in the telemetry CSV.`);
}

function colour(i) {
  if (mode === "speed") return ramp((D.v[i] - vMin) / (vMax - vMin));
  if (mode === "lean") return ramp(D.lean[i] / leanMax);
  if (D.brake[i] > 0.01) return THEME.brake;
  if (D.throttle[i] > 0.01) return THEME.throttle;
  return THEME.coast;
}

function setup(canvas) {
  const r = canvas.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  canvas.width = r.width * dpr; canvas.height = r.height * dpr;
  const ctx = canvas.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, r.width, r.height);
  return [ctx, r.width, r.height];
}

const all = [...D.left, ...D.right];
const bx = [Math.min(...all.map(p => p[0])), Math.max(...all.map(p => p[0]))];
const by = [Math.min(...all.map(p => p[1])), Math.max(...all.map(p => p[1]))];
let toScreen = null;

function drawMap() {
  const [ctx, w, h] = setup(mapCanvas);
  const pad = 24, k = Math.min((w - 2 * pad) / (bx[1] - bx[0]), (h - 2 * pad) / (by[1] - by[0]));
  const ox = (w - k * (bx[1] - bx[0])) / 2, oy = (h - k * (by[1] - by[0])) / 2;
  toScreen = (x, y) => [ox + (x - bx[0]) * k, h - oy - (y - by[0]) * k];

  const hasPhoto = showPhoto && photo && photo.complete && photo.naturalWidth;
  if (hasPhoto) {
    // Image pixel (0,0) is the track origin; one pixel is D.bg.mpp metres.
    const o = toScreen(0, 0), s = D.bg.mpp * k;
    ctx.drawImage(photo, o[0], o[1], photo.naturalWidth * s, photo.naturalHeight * s);
    ctx.fillStyle = "rgba(10,12,14,0.35)"; ctx.fillRect(0, 0, w, h);
  }
  ctx.beginPath();
  D.left.forEach((p, i) => { const q = toScreen(...p); i ? ctx.lineTo(...q) : ctx.moveTo(...q); });
  ctx.closePath();
  D.right.forEach((p, i) => { const q = toScreen(...p); i ? ctx.lineTo(...q) : ctx.moveTo(...q); });
  ctx.closePath();
  if (!hasPhoto) { ctx.fillStyle = THEME.surface; ctx.fill("evenodd"); }
  ctx.strokeStyle = hasPhoto ? "rgba(255,255,255,0.75)" : THEME.edge; ctx.lineWidth = 1; ctx.lineJoin = "round"; ctx.stroke();

  ctx.lineWidth = 3; ctx.lineCap = "butt";
  for (let i = 0; i < n; i++) {
    const j = (i + 1) % n, braking = mode === "inputs" && D.brake[i] > 0.01;
    ctx.setLineDash(braking ? [4, 3] : []);  // braking is dashed as well as orange
    ctx.beginPath(); ctx.moveTo(...toScreen(D.x[i], D.y[i])); ctx.lineTo(...toScreen(D.x[j], D.y[j]));
    ctx.strokeStyle = colour(i); ctx.stroke();
  }
  ctx.setLineDash([]);
  const s = toScreen(D.x[0], D.y[0]);
  ctx.fillStyle = THEME.text; ctx.fillRect(s[0] - 2, s[1] - 7, 4, 14);
  if (cursor >= 0) {
    const c = toScreen(D.x[cursor], D.y[cursor]);
    ctx.beginPath(); ctx.arc(c[0], c[1], 6, 0, 7); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.strokeStyle = THEME.bg; ctx.lineWidth = 2; ctx.stroke();
  }
}

// Trace layout: labels in a left gutter, speed line on top, throttle and brake strips below.
const GUTTER = 70, RIGHT = 14;
function traceIndexAt(x) {
  const w = traceCanvas.getBoundingClientRect().width;
  return Math.min(Math.max(Math.round((x - GUTTER) / (w - GUTTER - RIGHT) * (n - 1)), 0), n - 1);
}
function drawTrace() {
  const [ctx, w, h] = setup(traceCanvas);
  const bar = 10, top = 12, bottom = h - 2 * bar - 18;
  const vLo = Math.max(0, vMin - 0.15 * (vMax - vMin)), vHi = vMax + 0.05 * (vMax - vMin);
  const X = i => GUTTER + (w - GUTTER - RIGHT) * i / (n - 1), Y = v => bottom - (bottom - top) * (v - vLo) / (vHi - vLo);
  ctx.font = "12px system-ui, sans-serif"; ctx.fillStyle = THEME.muted; ctx.textBaseline = "middle";
  ctx.fillText("Speed", 12, (top + bottom) / 2);
  ctx.fillText("Throttle", 12, bottom + 8 + bar / 2);
  ctx.fillText("Brake", 12, bottom + 12 + bar * 1.5);
  ctx.strokeStyle = THEME.text; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = 0; i < n; i++) i ? ctx.lineTo(X(i), Y(D.v[i])) : ctx.moveTo(X(i), Y(D.v[i]));
  ctx.stroke();
  const bw = Math.max((w - GUTTER - RIGHT) / n, 1);
  ctx.globalAlpha = 1;
  for (let i = 0; i < n; i++) {
    if (D.throttle[i] > 0) { ctx.globalAlpha = D.throttle[i]; ctx.fillStyle = THEME.throttle; ctx.fillRect(X(i), bottom + 8, bw, bar); }
    if (D.brake[i] > 0) { ctx.globalAlpha = D.brake[i]; ctx.fillStyle = THEME.brake; ctx.fillRect(X(i), bottom + 12 + bar, bw, bar); }
  }
  ctx.globalAlpha = 1;
  if (cursor >= 0) { ctx.fillStyle = "#ffffff99"; ctx.fillRect(X(cursor), 0, 1, h); }
}

function draw() { drawMap(); drawTrace(); }

function show(i) {
  cursor = i;
  if (i < 0) { el("readout").textContent = HINT; draw(); return; }
  const parts = [`${D.s[i].toFixed(0)} m`, `${D.t[i].toFixed(2)} s`, `${D.v[i].toFixed(0)} km/h`,
    `throttle ${(100 * D.throttle[i]).toFixed(0)}%`, `brake ${(100 * D.brake[i]).toFixed(0)}%`,
    `lateral ${Math.abs(D.latG[i]).toFixed(2)} g`, `longitudinal ${D.longG[i].toFixed(2)} g`];
  if (D.lean) parts.push(`lean ${D.lean[i].toFixed(0)}°`);
  el("readout").innerHTML = parts.map((p, k) => k < 3 ? `<b>${p}</b>` : p.replace(/([-\d.]+ ?(%|g|°))$/, "<b>$1</b>")).join(" &nbsp; ");
  traceCanvas.setAttribute("aria-valuenow", Math.round(D.s[i]));
  traceCanvas.setAttribute("aria-valuetext", parts.join(", "));
  draw();
}

// Map: follow a mouse; on touch, a tap picks the nearest point (dragging still scrolls the page).
function pickOnMap(e) {
  const r = mapCanvas.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  let best = -1, bd = (e.pointerType === "mouse" ? 40 : 60) ** 2;
  for (let i = 0; i < n; i++) {
    const p = toScreen(D.x[i], D.y[i]), d = (p[0] - x) ** 2 + (p[1] - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  show(best);
}
mapCanvas.addEventListener("pointermove", e => { if (e.pointerType === "mouse") pickOnMap(e); });
mapCanvas.addEventListener("pointerdown", pickOnMap);

// Trace: hover with a mouse, drag with a finger or pen, or step with the keyboard.
let dragging = false;
const traceAt = e => show(traceIndexAt(e.clientX - traceCanvas.getBoundingClientRect().left));
traceCanvas.addEventListener("pointerdown", e => {
  dragging = true;
  try { traceCanvas.setPointerCapture(e.pointerId); } catch { /* pointer already gone */ }
  traceAt(e);
});
traceCanvas.addEventListener("pointermove", e => { if (dragging || e.pointerType === "mouse") traceAt(e); });
const stopDrag = () => { dragging = false; };
traceCanvas.addEventListener("pointerup", stopDrag);
traceCanvas.addEventListener("pointercancel", stopDrag);
traceCanvas.addEventListener("lostpointercapture", stopDrag);
traceCanvas.addEventListener("keydown", e => {
  const step = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1, PageUp: 25, PageDown: -25 }[e.key];
  let i = cursor < 0 ? 0 : cursor;
  if (step !== undefined) i = (i + (e.shiftKey ? step * 10 : step) + n) % n;
  else if (e.key === "Home") i = 0;
  else if (e.key === "End") i = n - 1;
  else return;
  e.preventDefault(); show(i);
});

document.querySelectorAll("button[data-mode]").forEach(b => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll("button[data-mode]").forEach(o => o.setAttribute("aria-pressed", o === b));
  describeMode(); draw();
}));
addEventListener("resize", draw);
describeMode();
draw();
</script>
</html>
