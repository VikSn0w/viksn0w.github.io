for (const ev of ["pointerup", "pointercancel", "lostpointercapture"]) chartBox.addEventListener(ev, () => { chartDrag = false; });
el("chartBtn").addEventListener("click", () => {
  chartBox.hidden = !chartBox.hidden;
  el("chartBtn").setAttribute("aria-checked", !chartBox.hidden);
  layoutHud(); drawChartBase(); needsRender = true;
});

// Keep the readout clear of the bottom bar, whose height changes with wrapping.
function layoutHud() { el("hud").style.bottom = el("bottom").offsetHeight + 8 + "px"; }
function resize() {
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  if (cam === "orbit" && !userMoved) frameTrack();
  layoutHud(); drawChartBase(); needsRender = true;
}
addEventListener("resize", resize); resize();

function choose(attr, value) {
  document.querySelectorAll(`button[data-${attr}]`).forEach(b => b.setAttribute("aria-pressed", b.dataset[attr] === value));
}
document.querySelectorAll("button[data-cam]").forEach(b => b.addEventListener("click", () => {
  cam = b.dataset.cam; choose("cam", cam);
  controls.enabled = cam === "orbit"; snap = true; needsRender = true;
  camera.fov = cam === "onboard" ? 75 : 55; camera.updateProjectionMatrix();
  if (cam === "orbit") { userMoved = false; frameTrack(); }
}));
document.querySelectorAll("button[data-mode]").forEach(b => b.addEventListener("click", () => { choose("mode", b.dataset.mode); setMode(b.dataset.mode); }));
function setPlaying(p) { playing = p; el("play").textContent = p ? "Pause" : "Play"; needsRender = true; }
el("play").addEventListener("click", () => setPlaying(!playing));
el("rate").addEventListener("change", e => { rate = +e.target.value; });
scrub.addEventListener("input", () => { simT = +scrub.value % lapT; snap = true; needsRender = true; });
addEventListener("keydown", e => {
  if (e.code !== "Space" || e.target.closest("button, select, input, textarea, a")) return;
  e.preventDefault(); setPlaying(!playing);
});

// For checks: jump to a time or switch camera from outside the module.
window.lapView = { seek: t => { simT = t % lapT; snap = true; needsRender = true; }, play: setPlaying,
                   camera: name => document.querySelector(`[data-cam=${name}]`).click() };
setMode("speed"); setPlaying(playing);
window.sceneReady = true;
requestAnimationFrame(frame);
</script>
</html>
